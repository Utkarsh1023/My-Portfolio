# Render Blueprint for the Express backend
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: mern-portfolio-server
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production

      # Render injects PORT automatically; keep 10000 as a safe default.
      - key: PORT
        value: 10000

      # --- Required (set in Render dashboard) ---
      - key: MONGODB_URI
        sync: false          # MUST match your Atlas cluster; set in Render dashboard
      - key: JWT_SECRET
        sync: false
      - key: CLIENT_ORIGIN
        sync: false          # comma-separated frontend URL(s), e.g. https://your-portfolio.vercel.app
      - key: EMAIL_USER
        sync: false          # Gmail address used to login to SMTP
      - key: EMAIL_PASS
        sync: false          # Gmail App Password (16 chars, no spaces)

      # --- Optional (defaults to Gmail SMTP) ---
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 465
      - key: EMAIL_FROM
        sync: false          # optional; defaults to EMAIL_USER
      - key: CONTACT_RECEIVER_EMAIL
        sync: false          # optional; defaults to EMAIL_FROM
      - key: JWT_EXPIRES_IN
        value: 7d
